# Gradle 8.7 cannot run on the system default JDK 25 (cryptic "25.0.4.1" failure);
# pin the build JVM to JDK 17 so plain ./gradlew works without setting JAVA_HOME.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
android.enableJetifier=true
android.nonTransitiveRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/gradle_oom.hprof
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.daemon=false
